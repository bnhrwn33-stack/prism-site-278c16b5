<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>חנות אונליין - תיק וטלפון</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --primary: #2563EB;
      --gray: #6B7280;
      --bg: #F9FAFB;
      --card-bg: #FFFFFF;
      --border: #E5E7EB;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
    }
    * { box-sizing: border-box; margin:0; padding:0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: #111827;
      line-height: 1.6;
    }
    a { text-decoration: none; color: inherit; }
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      position: sticky;
      top:0;
      z-index:100;
    }
    .logo { font-size: 1.5rem; font-weight: 600; color: var(--primary); }
    .cart-icon {
      position: relative;
      display: inline-flex;
      align-items: center;
      cursor: pointer;
    }
    .cart-icon img { width: 24px; height:24px; }
    #cart-count {
      background: var(--primary);
      color: white;
      border-radius: 50%;
      padding: 2px 6px;
      font-size: 0.75rem;
      position: absolute;
      top:-8px; right:-8px;
    }
    main { padding: 2rem; max-width: 1200px; margin:auto; }
    h1 { text-align:center; margin-bottom:2rem; color:var(--primary); }
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
    }
    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }
    .product-card img {
      width:100%;
      height:180px;
      object-fit:cover;
    }
    .product-card .info {
      flex:1;
      padding:1rem;
      display:flex;
      flex-direction:column;
    }
    .product-card h2 { font-size:1.25rem; margin-bottom:0.5rem; color:#111827; }
    .product-card p { color:var(--gray); flex-grow:1; margin-bottom:1rem; }
    .product-card .price {
      font-weight:600;
      font-size:1.125rem;
      color:var(--primary);
      margin-bottom:1rem;
    }
    .product-card button {
      background: var(--primary);
      color:white;
      border:none;
      padding:0.75rem 1rem;
      border-radius:4px;
      cursor:pointer;
      font-weight:500;
      transition:background 0.2s;
    }
    .product-card button:hover { background:#1d4ed8; }
    footer {
      text-align:center;
      padding:2rem;
      color:var(--gray);
      font-size:0.875rem;
      border-top:1px solid var(--border);
      margin-top:3rem;
    }
    @media (max-width:640px) {
      header { flex-direction:column; gap:1rem; }
      .products-grid { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">MyShop</div>
    <div class="cart-icon">
      <img src="https://img.icons8.com/ios-filled/24/ffffff/shopping-cart.png" alt="Cart">
      <span id="cart-count">0</span>
    </div>
  </header>

  <main>
    <h1>המוצרים שלנו</h1>
    <section class="products-grid">
      <!-- Products will be injected by script.js -->
    </section>
  </main>

  <footer>
    © 2025 MyShop. כל הזכויות שמורות.
  </footer>

  <script src="script.js"></script>
  <script>
    // Render product grid on index page
    document.addEventListener('DOMContentLoaded', () => {
      const grid = document.querySelector('.products-grid');
      if (!grid) return;
      products.forEach(p => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <img src="${p.image}" alt="${p.name}">
          <div class="info">
            <h2>${p.name}</h2>
            <p>${p.description}</p>
            <p class="price">${p.price.toFixed(2)} ₪</p>
            <button onclick="addToCart(${p.id})">הוסף לעגלה</button>
          </div>
        `;
        grid.appendChild(card);
      });
    });
  </script>
</body>
</html>
